<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 860">
  <title>LastBag Logo — Complete Brand Identity</title>

  <!-- PRIMARY LOGO LIGHT -->
  <rect x="40" y="50" width="600" height="180" fill="#F8F7F5" rx="16"/>
  <g transform="translate(108,140)">
    <rect x="-28" y="-22" width="56" height="46" fill="#D85A30" rx="12"/>
    <path d="M -13,-22 L -13,-36 Q -13,-46 0,-46 Q 13,-46 13,-36 L 13,-22" fill="none" stroke="#D85A30" stroke-width="7" stroke-linecap="round"/>
    <path d="M 0,18 L 0,-4 Q 0,-14 -9,-14 Q -9,-4 0,-4 Q 9,-4 9,-14 Q 0,-14 0,-4" fill="white"/>
    <line x1="0" y1="18" x2="0" y2="-2" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="158" y="154" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#1A1A1A" letter-spacing="-2">Last</text>
  <text x="338" y="154" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#D85A30" letter-spacing="-2">Bag</text>
  <text x="158" y="186" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#9CA3AF" letter-spacing="0.3">Rescue food. Save money. Nepal</text>
  <text x="340" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">PRIMARY — LIGHT BACKGROUND</text>

  <!-- DARK VERSION -->
  <rect x="40" y="268" width="600" height="180" fill="#0F0F0F" rx="16"/>
  <g transform="translate(108,358)">
    <rect x="-28" y="-22" width="56" height="46" fill="#D85A30" rx="12"/>
    <path d="M -13,-22 L -13,-36 Q -13,-46 0,-46 Q 13,-46 13,-36 L 13,-22" fill="none" stroke="#D85A30" stroke-width="7" stroke-linecap="round"/>
    <path d="M 0,18 L 0,-4 Q 0,-14 -9,-14 Q -9,-4 0,-4 Q 9,-4 9,-14 Q 0,-14 0,-4" fill="white"/>
    <line x1="0" y1="18" x2="0" y2="-2" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="158" y="372" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="white" letter-spacing="-2">Last</text>
  <text x="338" y="372" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" fill="#D85A30" letter-spacing="-2">Bag</text>
  <text x="158" y="404" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" letter-spacing="0.3">Rescue food. Save money. Nepal</text>
  <text x="340" y="466" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">DARK VERSION — FOR WEBSITE HERO</text>

  <!-- ICON SIZES -->
  <text x="340" y="504" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">ICON AT EVERY SIZE</text>

  <!-- App icon 100px -->
  <g transform="translate(130,576)">
    <rect x="-50" y="-50" width="100" height="100" fill="#D85A30" rx="22"/>
    <rect x="-32" y="-26" width="64" height="52" fill="white" rx="13"/>
    <path d="M -15,-26 L -15,-42 Q -15,-54 0,-54 Q 15,-54 15,-42 L 15,-26" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0,18 L 0,-4 Q 0,-16 -11,-16 Q -11,-4 0,-4 Q 11,-4 11,-16 Q 0,-16 0,-4" fill="#D85A30"/>
    <line x1="0" y1="18" x2="0" y2="-2" stroke="#D85A30" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="130" y="646" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">APP ICON</text>

  <!-- Medium 60px -->
  <g transform="translate(280,576)">
    <rect x="-30" y="-30" width="60" height="60" fill="#D85A30" rx="14"/>
    <rect x="-19" y="-16" width="38" height="30" fill="white" rx="7"/>
    <path d="M -9,-16 L -9,-26 Q -9,-32 0,-32 Q 9,-32 9,-26 L 9,-16" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <path d="M 0,10 L 0,-2 Q 0,-9 -6,-9 Q -6,-2 0,-2 Q 6,-2 6,-9 Q 0,-9 0,-2" fill="#D85A30"/>
  </g>
  <text x="280" y="646" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">MEDIUM</text>

  <!-- Small 40px -->
  <g transform="translate(390,576)">
    <rect x="-20" y="-20" width="40" height="40" fill="#D85A30" rx="9"/>
    <rect x="-12" y="-10" width="24" height="20" fill="white" rx="5"/>
    <path d="M -5,-10 L -5,-17 Q -5,-21 0,-21 Q 5,-21 5,-17 L 5,-10" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 0,6 L 0,-1 Q 0,-5 -4,-5 Q -4,-1 0,-1 Q 4,-1 4,-5 Q 0,-5 0,-1" fill="#D85A30"/>
  </g>
  <text x="390" y="646" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">SMALL</text>

  <!-- Favicon 24px -->
  <g transform="translate(470,576)">
    <rect x="-12" y="-12" width="24" height="24" fill="#D85A30" rx="5"/>
    <rect x="-7" y="-6" width="14" height="12" fill="white" rx="3"/>
    <path d="M -3,-6 L -3,-10 Q -3,-13 0,-13 Q 3,-13 3,-10 L 3,-6" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="470" y="646" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">FAVICON</text>

  <!-- STACKED -->
  <text x="340" y="688" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">STACKED — WHATSAPP / SOCIAL PROFILE</text>

  <g transform="translate(340,788)">
    <rect x="-110" y="-90" width="220" height="180" fill="#F8F7F5" rx="16"/>
    <g transform="translate(0,-28)">
      <rect x="-28" y="-22" width="56" height="46" fill="#D85A30" rx="12"/>
      <path d="M -13,-22 L -13,-36 Q -13,-46 0,-46 Q 13,-46 13,-36 L 13,-22" fill="none" stroke="#D85A30" stroke-width="7" stroke-linecap="round"/>
      <path d="M 0,18 L 0,-4 Q 0,-14 -9,-14 Q -9,-4 0,-4 Q 9,-4 9,-14 Q 0,-14 0,-4" fill="white"/>
      <line x1="0" y1="18" x2="0" y2="-2" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="38" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="900" fill="#1A1A1A" text-anchor="middle" letter-spacing="-1">Last<tspan fill="#D85A30">Bag</tspan></text>
    <text x="0" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle" letter-spacing="1">Nepal</text>
  </g>

</svg>
